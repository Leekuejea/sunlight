# Builds installers for macOS (Apple Silicon + Intel) and Windows.
# Trigger: push a tag like v1.0.0. The installers are attached to a published GitHub release.
name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build # the Rust crate embeds dist/, so it must exist before cargo test
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS builds are ad-hoc signed (tauri.conf.json signingIdentity "-"). For Developer ID signing and
          # notarization add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD and APPLE_TEAM_ID here from repository secrets. An empty APPLE_CERTIFICATE fails the build.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sunlight ${{ github.ref_name }}
          releaseDraft: false
          args: ${{ matrix.args }}
